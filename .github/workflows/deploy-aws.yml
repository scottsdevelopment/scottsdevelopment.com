name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for aws-actions/configure-aws-credentials

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    # No `environment:`: the IAM role trusts repo:scottsdevelopment/scottsdevelopment.com:ref:refs/heads/main only,
    # and a job environment would change the OIDC subject.
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.SITE_BUCKET }}
      DIST: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload hashed assets (immutable, cached 1 year)
        run: aws s3 sync out/_next/static "s3://$BUCKET/_next/static" --cache-control "public,max-age=31536000,immutable" --only-show-errors
      - name: Upload pages, RSC payloads and other files
        run: aws s3 sync out/ "s3://$BUCKET/" --delete --exclude "_next/static/*" --cache-control "public,max-age=300,s-maxage=86400" --only-show-errors
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*" --query Invalidation.Id --output text
      - name: Remove hashed assets from older builds
        run: aws s3 sync out/_next/static "s3://$BUCKET/_next/static" --delete --only-show-errors
      - name: Report file count
        run: echo "files in out/ = $(find out -type f | wc -l)"
